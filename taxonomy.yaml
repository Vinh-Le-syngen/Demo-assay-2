# sys — canonical taxonomy / plane registry.
#
# The physical tree is organized by SUBSYSTEM NAME (packages/*), not by plane — because
# real subsystems are cross-plane (one primary plane, responsibilities in others) and a
# plane-first folder tree would mislead. This file is the classification layer: it maps
# every entity to its plane facets.
#
# NAMING (canonical: qarar/docs/architecture/planes.md): the `planes` below ARE the
# **System Planes (P5)** — the cadre-os five (Control/Data/Observability/Governance/Recovery),
# describing HOW a system is run. This is one of the two plane axes. The other is the
# **Business Planes** (Market/Offering/Interaction/Delivery/Financial = WHAT part of the
# business). Only business-capability systems carry one (see PLANES.md; source: qarar
# planes.md §7): billing/pay → Financial, vault → Delivery (catalog/case → Offering/Delivery aren't
# in /sys yet). Platform / governance / cross-cutting systems (auth, assay, atlas, canon, …)
# intentionally have NONE — they serve every Business plane, so a single home would be wrong. A
# package MAY mirror its Business plane here via the optional `business_planes` field (validated
# against `business_planes` below). Inside P5: a @sys/* package is a Data-plane system (owns truth),
# a @eng/* package is a Control-plane engine; Obs/Governance/Recovery wrap both. Full doctrine: PLANES.md.
#
# RULE: taxonomy = identity, kind, plane, path, purpose, + provenance (owner / last_reviewed /
# status). NOT implementation detail (no build/tsconfig/runtime config duplicated here). Keep it
# small and durable. Enforced by scripts/check-taxonomy.mjs — the package-catalog gate: every
# packages/* must be classified, carry complete provenance, and have a README + CHANGELOG.
#
# MEMBERSHIP: this file classifies what IS here; MEMBERSHIP.md is the canonical rule for what
# BELONGS here (the membership test, per-package origin + canonical/thin-client, and the
# explicit exclusions). Add a package here only after it passes that test.

# Control-plane facets (see header). Used as primary_plane / secondary_planes below.
planes:
  - control # principal/session/tenant/permission context; decides what proceeds
  - data # concrete provider interaction (crypto, IO, network)
  - observability # structured telemetry; emits, never decides
  - governance # policy, permission model, invariants, the stable contract
  - recovery # expiry, refresh/retry, forced re-auth, degraded mode

# Business planes — the SECOND, orthogonal axis (WHAT part of the business). Consumer-owned
# (Qarar); optional here via a per-entity `business_planes: [...]`. Not all packages have one.
business_planes:
  - market # demand, positioning, acquisition
  - offering # the product/service catalog & pricing
  - interaction # how customers engage (consent, dialog, support)
  - delivery # fulfilment, evidence, operations
  - financial # billing, payment, revenue

entity_kinds:
  - app
  - system
  - package
  - adapter
  - method
  - middleware
  - contract
  - policy
  - runtime
  - doc

# Lifecycle status per package (provenance). Enforced by scripts/check-taxonomy.mjs.
statuses:
  - active # in use, maintained
  - experimental # usable but unstable / API may change (e.g. thin clients pending engine extraction)
  - deprecated # scheduled for removal; do not adopt

# Test posture per package — the assay coverage profile each package's test battery must meet.
# This is the SoT for the floor: assay.config.json `coverage.areaProfiles` is GENERATED from each
# entity's `test_profile` (scripts/gen-assay-areas.mjs); check-assay-areas.mjs fails on drift.
test_profiles:
  - full # unit+integration+e2e+regression+negative+adversarial+governance, >=2 each
  - lightweight # unit+regression, >=1 each
  - virtual # no floor (opt-out; justify in the entity purpose/comment)

entities:
  - id: sys-auth
    kind: package
    path: packages/auth
    owner: unassigned # TODO: assign a team/role
    last_reviewed: 2026-06-08
    status: active
    npm: "@sys/auth"
    test_profile: full
    primary_plane: control
    secondary_planes: [governance, data, observability, recovery]
    purpose: >-
      Authentication & authorization subsystem. Establishes principal, session, tenant,
      and permission context for app consumption; decides what may proceed. Owns Control;
      integrates the other planes via injected seams (adapter, permission model, sink, policy).
    # Cross-plane internal map (control-owned, integrating outward):
    modules:
      - path: src/core/contract.ts
        plane: control
        role: decision contract + injected seam interfaces (types only)
      - path: src/core/config.ts
        plane: control
        role: defineAuth composition root
      - path: src/server
        plane: control
        role: createServerAuth — authenticate/authorize decision surface
      - path: src/server/verify.ts
        plane: data
        role: jose token verification (JWKS-first, HS256 legacy)
      - path: src/middleware
        plane: control
        role: routing-only session gate (no authz branching)
      - path: src/client/session-machine.ts
        plane: recovery
        role: pure session state machine (init/auth/refresh/expire/signout/error)
      - path: src/react
        plane: control
        role: thin React binding (AuthProvider/useAuth) over the session machine
      - path: src/methods
        plane: control
        role: enabled-method registry (declarative, tree-shakeable plugins)
      - path: src/adapters/supabase.ts
        plane: data
        role: backend adapter — verify, role resolver, request-scoped RLS client
      - path: src/observability
        plane: observability
        role: AuthEvent + injectable sink

